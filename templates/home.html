<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction</title>
</head>
<body>

<h2>Loan Prediction Form</h2>

<form action="/home" method="post">

    Gender: 
    <select name="Gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select><br><br>

    <!-- Married Option -->
    Married: 
    <select name="Married" required>
        <option value="">Select Status</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select><br><br>

    Dependents: 
    <select name="Dependents" required>
        <option value="">Select Dependents</option>
        <option value="LOW">Low</option>
        <option value="HIGH">High</option>
    </select><br><br>

    <!-- Education Option -->
    Education: 
    <select name="Education" required>
        <option value="">Select Education</option>
        <option value="Graduate">Graduate</option>
        <option value="Not Graduate">Not Graduate</option>
    </select><br><br>

    <!-- Self Employed Option -->
    Self Employed: 
    <select name="Self_Employed" required>
        <option value="">Select Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select><br><br>

    <!-- नंबर्स वाले इनपुट वैसे ही रहेंगे -->
    Loan Amount: <input type="number" name="LoanAmount" required><br><br>
    Loan Term(month): <input type="number" name="Loan_Amount_Term" required><br><br>
    Credit History: <input type="number" name="Credit_History" required><br><br>

    <!-- Property Area Option -->
    Property Area: 
    <select name="Property_Area" required>
        <option value="">Select Area</option>
        <option value="Urban">Urban</option>
        <option value="Semiurban">Semiurban</option>
        <option value="Rural">Rural</option>
    </select><br><br>

    Family Income: <input type="number" name="family_income" required><br><br>


    <button type="submit">Predict</button>

</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
